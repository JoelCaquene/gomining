{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    :root {
        --card-blue: #101f42;
        --glow-blue: #00d2ff;
        --text-light: #ffffff;
        --text-muted: #8a99ad;
        --usdt-color: #26a69a;
        --success: #00e676;
    }

    .amount-btn-kz.active, .amount-btn-usdt.active { 
        border-color: var(--glow-blue); 
        color: var(--glow-blue); 
        background: rgba(0, 210, 255, 0.1);
    }

    .info-rules { 
        margin-top: 20px; 
        font-size: 13px; 
        color: #b4c6ef; 
        background: rgba(255, 23, 68, 0.04); 
        border: 1px solid rgba(255, 23, 68, 0.15);
        padding: 16px; 
        border-radius: 14px; 
    }

    .usdt-rules {
        background: rgba(38, 166, 154, 0.04);
        border: 1px solid rgba(38, 166, 154, 0.2);
    }
    .usdt-rules h4 { color: #4db6ac !important; }
    .usdt-rules li span { background: rgba(38, 166, 154, 0.2) !important; color: #4db6ac !important; }
    
    .info-rules h4 { margin: 0 0 12px 0; color: #ff5252; font-size: 14px; font-weight: 600; }
    .info-rules ul { list-style: none; padding: 0; margin: 0; }
    .info-rules li { margin-bottom: 10px; display: flex; align-items: flex-start; line-height: 1.4; }
    .info-rules li:last-child { margin-bottom: 0; }
    
    .info-rules li span { 
        background: rgba(255, 23, 68, 0.2); 
        color: #ff5252; 
        width: 18px; 
        height: 18px; 
        border-radius: 50%; 
        display: inline-flex; 
        align-items: center; 
        justify-content: center;
        font-size: 11px; 
        font-weight: bold;
        margin-right: 10px; 
        flex-shrink: 0; 
        margin-top: 2px;
    }

    .crypto-notice-banner {
        background: rgba(38, 166, 154, 0.1);
        border: 1px dashed rgba(38, 166, 154, 0.3);
        color: #80cbc4;
        padding: 12px;
        border-radius: 10px;
        font-size: 12px;
        text-align: center;
        margin-bottom: 14px;
        line-height: 1.4;
    }

    .bank-option-btn, .crypto-option-btn {
        width: 100%; 
        padding: 16px; 
        margin-bottom: 10px;
        background: var(--card-blue); 
        border: 1px solid rgba(255,255,255,0.05);
        color: var(--text-light);
        text-align: left; 
        border-radius: 12px; 
        cursor: pointer;
        font-weight: 600; 
        font-size: 15px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    
    .bank-option-btn.active, .crypto-option-btn.active { 
        border-color: var(--glow-blue); 
        background: rgba(0, 210, 255, 0.08); 
        color: var(--glow-blue);
    }

    .crypto-badge-icon {
        color: var(--usdt-color);
        font-size: 16px;
    }

    .bank-info-card {
        background: var(--card-blue);
        border: 1px solid rgba(255,255,255,0.04);
        padding: 16px;
        border-radius: 16px;
        margin-bottom: 20px;
    }
    
    .info-group { margin-bottom: 16px; }
    .info-group:last-child { margin-bottom: 0; }
    .info-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .copy-input {
        display: flex; 
        align-items: center; 
        background: rgba(10, 17, 40, 0.6);
        border: 1px solid rgba(255,255,255,0.06); 
        border-radius: 10px; 
        box-sizing: border-box;
        width: 100%;
    }
    
    .copy-input input { 
        border: none; 
        padding: 12px; 
        min-width: 0; 
        flex: 1; 
        outline: none; 
        font-size: 14px; 
        background: transparent; 
        color: #fff;
        font-weight: 500;
    }
    
    .copy-icon { 
        background: rgba(0, 210, 255, 0.12); 
        color: var(--glow-blue);
        border: none; 
        width: 46px;
        height: 44px;
        flex-shrink: 0; 
        cursor: pointer; 
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 0 9px 9px 0;
    }

    .qrcode-container-box {
        margin-top: 16px;
        background: rgba(10, 17, 40, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        padding: 16px;
        text-align: center;
    }

    .qrcode-title {
        font-size: 12px;
        color: var(--usdt-color);
        font-weight: 600;
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .qrcode-render {
        background: #fff;
        padding: 12px;
        display: inline-block;
        border-radius: 8px;
        margin-bottom: 8px;
    }

    .qrcode-render img {
        display: block;
        margin: 0 auto;
    }

    .qrcode-hint {
        display: block;
        font-size: 11px;
        color: var(--text-muted);
    }

    .upload-label { text-align: center; color: var(--text-light); font-size: 14px; margin-bottom: 16px; }
    
    .upload-box {
        border: 2px dashed rgba(0, 210, 255, 0.25); 
        background: rgba(16, 31, 66, 0.4);
        border-radius: 16px;
        padding: 32px 16px; 
        text-align: center; 
        cursor: pointer;
    }
    
    .upload-icon { font-size: 38px; color: var(--glow-blue); margin-bottom: 8px; }
    #upload-text { margin: 0; font-size: 14px; color: #a2b4cd; }
    #file-name { font-size: 12px; color: var(--glow-blue); margin-top: 8px; font-weight: bold; word-break: break-all; }
    
    .simple-input {
        width: 100%; 
        border: 1px solid rgba(255,255,255,0.08); 
        border-radius: 12px;
        padding: 14px; 
        box-sizing: border-box; 
        background: rgba(10, 17, 40, 0.6);
        color: #fff;
        font-size: 15px;
        outline: none;
    }
    
    .simple-input:focus { border-color: var(--glow-blue); }

    .btn-main {
        width: 100%; 
        background: linear-gradient(90deg, #0052d4 0%, #4364f7 50%, #6fb1fc 100%);
        color: white;
        border: none; 
        padding: 15px; 
        border-radius: 12px;
        font-size: 15px; 
        font-weight: 600; 
        cursor: pointer; 
        margin-top: 12px;
        text-align: center;
        display: block;
        box-sizing: border-box;
        text-decoration: none;
    }
    
    .btn-submit {
        background: linear-gradient(135deg, #00d2ff 0%, #0066ff 100%);
        box-shadow: 0 4px 12px rgba(0, 210, 255, 0.3);
    }
    
    .btn-main:disabled { 
        background: #1e293b !important; 
        color: #475569 !important;
        border: 1px solid #334155;
        box-shadow: none !important;
        cursor: not-allowed; 
    }

    .space-top { margin-top: 16px; }
    .space-top-lg { margin-top: 20px; }
    .space-bottom { margin-bottom: 16px; }

    .success-screen { text-align: center; padding: 32px 8px; }
    .success-icon { 
        width: 68px; height: 68px; 
        background: rgba(0, 230, 118, 0.15); 
        color: var(--success);
        border: 1px solid rgba(0, 230, 118, 0.3);
        border-radius: 50%; 
        display: flex; align-items: center; justify-content: center;
        font-size: 32px; margin: 0 auto 20px;
    }
    .success-screen h2 { font-size: 20px; font-weight: 700; margin-bottom: 12px; color: #fff; }
    .success-screen p { color: var(--text-muted); font-size: 14px; line-height: 1.5; margin-bottom: 24px; }
</style>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        let currentMethod = 'kwanza'; // 'kwanza' ou 'usdt'

        const methodBtns = document.querySelectorAll('.method-btn');
        const sectionKwanza = document.getElementById('section-kwanza');
        const sectionUsdt = document.getElementById('section-usdt');
        
        const selectorListKwanza = document.getElementById('selector-list-kwanza');
        const selectorListUsdt = document.getElementById('selector-list-usdt');

        const amountBtnsKz = document.querySelectorAll('.amount-btn-kz');
        const amountBtnsUsdt = document.querySelectorAll('.amount-btn-usdt');
        
        const manualAmountKz = document.getElementById('manual-amount-kz');
        const manualAmountUsdt = document.getElementById('manual-amount-usdt');
        const equivKz = document.getElementById('equiv-kz');

        const bankBtnsKz = document.querySelectorAll('.bank-option-btn');
        const bankBtnsUsdt = document.querySelectorAll('.crypto-option-btn');

        const next1 = document.getElementById('to-step-2');
        const next2 = document.getElementById('to-step-3');
        const amountInput = document.getElementById('id_amount');
        const bankInput = document.getElementById('id_selected_bank');
        const paymentMethodTypeInput = document.getElementById('id_payment_method_type');

        // Inicializar método padrão
        paymentMethodTypeInput.value = 'kwanza';

        // Alternar entre Kwanza e USDT na Etapa 1
        methodBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                methodBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMethod = btn.dataset.method;
                paymentMethodTypeInput.value = currentMethod;

                // Resetar seleções e botões de avançar
                amountInput.value = '';
                bankInput.value = '';
                next1.disabled = true;
                next2.disabled = true;

                bankBtnsKz.forEach(b => b.classList.remove('active'));
                bankBtnsUsdt.forEach(b => b.classList.remove('active'));

                if (currentMethod === 'kwanza') {
                    sectionKwanza.style.display = 'block';
                    sectionUsdt.style.display = 'none';
                    selectorListKwanza.style.display = 'block';
                    selectorListUsdt.style.display = 'none';
                    manualAmountUsdt.value = '';
                    if(manualAmountKz.value && parseFloat(manualAmountKz.value) > 0) {
                        amountInput.value = manualAmountKz.value;
                        next1.disabled = false;
                    }
                } else {
                    sectionKwanza.style.display = 'none';
                    sectionUsdt.style.display = 'block';
                    selectorListKwanza.style.display = 'none';
                    selectorListUsdt.style.display = 'block';
                    manualAmountKz.value = '';
                    if(manualAmountUsdt.value && parseFloat(manualAmountUsdt.value) > 0) {
                        // Converte USDT para Kwanza para salvar no backend Django (1 USDT = 1000 Kz)
                        const valKz = parseFloat(manualAmountUsdt.value) * 1000;
                        amountInput.value = valKz;
                        next1.disabled = false;
                    }
                }
            });
        });

        // Input manual Kwanza
        manualAmountKz.addEventListener('input', (e) => {
            const val = e.target.value;
            amountBtnsKz.forEach(b => b.classList.remove('active'));
            if (val && parseFloat(val) > 0) {
                amountInput.value = val;
                document.querySelectorAll('.display-final-amount').forEach(el => el.value = parseFloat(val).toFixed(2));
                next1.disabled = false;
            } else {
                next1.disabled = true;
            }
        });

        // Botões rápidos Kwanza
        amountBtnsKz.forEach(btn => {
            btn.addEventListener('click', () => {
                amountBtnsKz.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                manualAmountKz.value = '';
                const val = btn.dataset.value;
                amountInput.value = val;
                document.querySelectorAll('.display-final-amount').forEach(el => el.value = parseFloat(val).toFixed(2));
                next1.disabled = false;
            });
        });

        // Input manual USDT (Taxa 1000 Kz = 1 USDT)
        manualAmountUsdt.addEventListener('input', (e) => {
            const valUsdt = e.target.value;
            amountBtnsUsdt.forEach(b => b.classList.remove('active'));
            if (valUsdt && parseFloat(valUsdt) > 0) {
                const valKz = parseFloat(valUsdt) * 1000;
                amountInput.value = valKz;
                equivKz.innerText = `Equivalente: Kz ${valKz.toLocaleString('pt-AO', {minimumFractionDigits: 2})}`;
                document.querySelectorAll('.display-final-usdt').forEach(el => el.value = parseFloat(valUsdt).toFixed(2) + " USDT");
                next1.disabled = false;
            } else {
                equivKz.innerText = "Equivalente: Kz 0.00";
                next1.disabled = true;
            }
        });

        // Botões rápidos USDT
        amountBtnsUsdt.forEach(btn => {
            btn.addEventListener('click', () => {
                amountBtnsUsdt.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                manualAmountUsdt.value = '';
                const valUsdt = btn.dataset.value;
                const valKz = parseFloat(valUsdt) * 1000;
                amountInput.value = valKz;
                equivKz.innerText = `Equivalente: Kz ${valKz.toLocaleString('pt-AO', {minimumFractionDigits: 2})}`;
                document.querySelectorAll('.display-final-usdt').forEach(el => el.value = parseFloat(valUsdt).toFixed(2) + " USDT");
                next1.disabled = false;
            });
        });

        // Step 1 -> 2
        next1.addEventListener('click', () => {
            goToStep(2);
            updateStepper(2);
        });

        // Seleção de Banco (Kwanza)
        bankBtnsKz.forEach(btn => {
            btn.addEventListener('click', () => {
                bankBtnsKz.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                bankInput.value = btn.dataset.bankId;
                next2.disabled = false;
            });
        });

        // Seleção de Canal USDT
        bankBtnsUsdt.forEach(btn => {
            btn.addEventListener('click', () => {
                bankBtnsUsdt.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                bankInput.value = btn.dataset.bankId;
                next2.disabled = false;
            });
        });

        // Step 2 -> 3
        next2.addEventListener('click', () => {
            const bankId = bankInput.value;
            document.querySelectorAll('.bank-info-card').forEach(card => card.style.display = 'none');
            const targetCard = document.getElementById(`details-${bankId}`);
            targetCard.style.display = 'block';

            // Alternar exibição interna no card de detalhes conforme o método
            const kwanzaFields = targetCard.querySelector('.kwanza-details-fields');
            const usdtFields = targetCard.querySelector('.usdt-details-fields');

            if (currentMethod === 'usdt') {
                kwanzaFields.style.display = 'none';
                usdtFields.style.display = 'block';

                // Gerar QR Code automático para a wallet USDT correspondente
                const qrContainer = targetCard.querySelector('.qrcode-render');
                const walletAddress = qrContainer.getAttribute('data-addr');
                // Limpar container anterior caso já exista
                qrContainer.innerHTML = '';
                if(walletAddress) {
                    new QRCode(qrContainer, {
                        text: walletAddress,
                        width: 140,
                        height: 140,
                        colorDark: "#000000",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H
                    });
                }
            } else {
                kwanzaFields.style.display = 'block';
                usdtFields.style.display = 'none';
            }

            goToStep(3);
            updateStepper(2);
        });

        // Step 3 -> 4
        document.getElementById('to-step-4').addEventListener('click', () => {
            goToStep(4);
            updateStepper(3);
        });

        // Upload Preview
        document.getElementById('file-upload').addEventListener('change', function() {
            if(this.files[0]) {
                document.getElementById('file-name').innerText = "Ficheiro: " + this.files[0].name;
                document.getElementById('upload-text').innerText = "Alterar ficheiro";
            }
        });

        function goToStep(step) {
            document.querySelectorAll('.step-content').forEach(el => el.style.display = 'none');
            document.getElementById(`step-${step}`).style.display = 'block';
        }

        function updateStepper(activeStep) {
            const dots = [document.getElementById('dot-1'), document.getElementById('dot-2'), document.getElementById('dot-3')];
            const lines = [document.getElementById('line-1'), document.getElementById('line-2')];
            
            dots.forEach((dot, idx) => {
                const stepNum = idx + 1;
                if (stepNum < activeStep) {
                    dot.className = "circle checked";
                    dot.innerHTML = "✓";
                    if(lines[idx]) lines[idx].classList.add('active');
                } else if (stepNum === activeStep) {
                    dot.className = "circle active";
                    dot.innerHTML = stepNum;
                } else {
                    dot.className = "circle";
                    dot.innerHTML = stepNum;
                }
            });
        }
    });

    function copyText(id) {
        const copyInput = document.getElementById(id);
        copyInput.select();
        copyInput.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(copyInput.value).then(() => {
            const btn = copyInput.nextElementSibling;
            const originalIcon = btn.innerText;
            btn.innerText = "✓";
            setTimeout(() => { btn.innerText = originalIcon; }, 1500);
        }).catch(() => {
            alert("Erro ao copiar dados.");
        });
    }
</script>
{% endblock %}
